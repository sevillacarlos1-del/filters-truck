<script>
'use strict';

/* ============================ 1. CONFIGURACIÓN ============================ */
const EMPRESA    = { name:'Truck Filters, c.a.', rif:'J-40127144-8', addr:'Av. Principal, Zona Industrial Municipal Norte, Galpón 4, Valencia — Edo. Carabobo', tel:'+58 241-500.22.44' };

const DB_KEY     = 'tf_db_v2';
const SESS_KEY   = 'tf_session_v2';
const CART_PRE   = 'tf_cart_';
const IVA_RATE   = 0.16;
/* Contraseña administrativa OBLIGATORIA para acceder al panel de oficina */
const ADMIN_USER = { pass:'XXTRUCK2025', name:'Administración', role:'admin' };

/* USERS es SOLO la semilla de fábrica: la lista real y editable vive en db.sellers (nube + localStorage). */
const USERS = [];

const VOL_TIERS = [[50,8],[25,5],[10,3]];
const CONDS = {
  normal:  { l:'Ruta pavimentada (normal)',       f:1.0  },
  severa:  { l:'Vía grave / mixta (severa)',      f:0.65 },
  extrema: { l:'Alta polvorienta (extrema)',      f:0.45 }
};

const TYPE_META = {
  aceite:       { l:'Aceite',        icon:'fa-oil-can'   },
  aire:         { l:'Aire',          icon:'fa-wind'      },
  combustible:  { l:'Combustible',   icon:'fa-gas-pump'  },
  'hidráulico': { l:'Hidráulico',    icon:'fa-gears'     },
  cabina:       { l:'Cabina / A.C.', icon:'fa-snowflake' },
  componente:   { l:'Componente',    icon:'fa-microchip' }
};

const ST = {
  pendiente:  { l:'Pendiente',  chip:'bg-amber-50 text-amber-800 border-amber-300',       ic:'fa-hourglass-half' },
  aprobado:   { l:'Aprobado',   chip:'bg-blue-50 text-blue-800 border-blue-300',          ic:'fa-circle-check'   },
  despachado: { l:'Despachado', chip:'bg-emerald-50 text-emerald-800 border-emerald-300', ic:'fa-truck-fast'     },
  rechazado:  { l:'Rechazado',  chip:'bg-red-50 text-red-700 border-red-300',             ic:'fa-circle-xmark'   }
};

/* ============================ 2. CATÁLOGO BASE ============================ */
/* Semilla vacía: el catálogo real se administra desde el panel y vive en la nube (db.products). */
const PRODUCTS = [];

const ENGINES = [
  { id:'isx15', label:'Cummins ISX15 / X15 — tráctil', oil:'TF-55102', fuel:'TF-33021', airP:'TF-22108', iv:{oil:25000,fuel:20000,airP:60000} },
  { id:'mx13',  label:'PACCAR MX-13 — Kenworth T680',  oil:'TF-55102', fuel:'TF-33021', airP:'TF-22108', iv:{oil:30000,fuel:20000,airP:60000} }
];

/* ============================ 3. UTILIDADES ============================ */
const $      = s => document.querySelector(s);
const round2 = v => Math.round(v * 100) / 100;
const money  = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
const esc    = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
const fD     = ts => new Date(ts).toLocaleDateString('es-VE', { day:'2-digit', month:'2-digit', year:'numeric' });
const fT     = ts => new Date(ts).toLocaleTimeString('es-VE', { hour:'2-digit', minute:'2-digit' });
const fDT    = ts => fD(ts) + ' · ' + fT(ts);
const t0     = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const uid    = () => 'P' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const volDisc = q => { for (const [min, d] of VOL_TIERS) if (q >= min) return d; return 0; };
const RIF_OK = r => /^[JVGPE]-\d{8}-\d(\/\d)?$/.test(String(r).trim().toUpperCase());
const initialsOf = n => String(n || '').split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const stChip = st => { const s = ST[st] || ST.pendiente; return `<span class="tag border ${s.chip}"><i class="fa-solid ${s.ic}"></i>${s.l}</span>`; };

const FILTER_IMG_FALLBACK = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" fill="#EEF3F9"/><g fill="none" stroke="#B8C1CC" stroke-width="3"><rect x="270" y="70" width="100" height="150" rx="10"/><line x1="270" y1="102" x2="370" y2="102"/><line x1="270" y1="120" x2="370" y2="120"/><rect x="295" y="220" width="50" height="22"/></g><text x="320" y="300" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#8894A3">Fotografía no disponible</text><text x="320" y="326" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#B8C1CC">assets/img/filters/</text></svg>`
);

function toast(msg, type='info', ms=3400) {
  const root = $('#toast-root'); if (!root) return;
  const el = document.createElement('div');
  el.className = `max-w-sm w-full bg-white border-l-4 rounded-xl shadow-lg p-3 text-xs font-medium pointer-events-auto transition-all duration-300 translate-y-2 opacity-0 ${
    type === 'ok'   ? 'border-emerald-500 text-navy-900' :
    type === 'warn' ? 'border-amber-500 text-navy-900'  :
    type === 'bad'  ? 'border-red-500 text-navy-900'    : 'border-navy-900 text-navy-900'
  }`;
  el.innerHTML = msg;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.remove('translate-y-2', 'opacity-0'));
  setTimeout(() => {
    el.classList.add('translate-y-2', 'opacity-0');
    setTimeout(() => el.remove(), 300);
  }, ms);
}

/* ======================================================================
   3.5 CAPA DE NUBE — Firebase Firestore (tiempo real)
   ---------------------------------------------------------------------- */
const FIREBASE_CONFIG = {
  apiKey:            "PEGA_AQUI_TU_API_KEY",
  authDomain:        "PEGA_AQUI.firebaseapp.com",
  projectId:         "PEGA_AQUI_PROJECT_ID",
  storageBucket:     "PEGA_AQUI.appspot.com",
  messagingSenderId: "PEGA_AQUI_SENDER_ID",
  appId:             "PEGA_AQUI_APP_ID"
};

const CLOUD_DOC   = 'truckfilters/state';
const CLIENT_ID   = 'C' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
let   FS          = null;
let   cloudReady  = false;
let   cloudDirty  = false;
let   cloudTimer  = null;
let   lastCloudRev = 0;
let   applyingRemote = false;
let   cloudStatus = 'off';       /* off | ok | sync | cfg */

function setCloudStatus(s) { cloudStatus = s; updateConnChip(); }

function cloudInit() {
  if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith('PEGA_')) { setCloudStatus('cfg'); return; }
  if (typeof firebase === 'undefined') { setCloudStatus('off'); return; }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    FS = firebase.firestore();
    FS.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    cloudReady = true;
    cloudSubscribe();
    cloudPull();
  } catch (e) {
    console.error('cloudInit:', e);
    setCloudStatus('off');
  }
}

const cloudRef = () => (cloudReady && FS) ? FS.doc(CLOUD_DOC) : null;

function cloudPull() {
  const r = cloudRef(); if (!r) return;
  setCloudStatus('sync');
  r.get().then(snap => {
    if (snap.exists) applyRemote(snap.data());
    else queueCloudSync(0);
    setCloudStatus('ok');
  }).catch(err => { console.error('cloudPull:', err); setCloudStatus('off'); });
}

function cloudSubscribe() {
  const r = cloudRef(); if (!r) return;
  r.onSnapshot(snap => {
    if (!snap.exists) return;
    const data = snap.data();
    if (data.writer === CLIENT_ID) return;
    if ((data.rev || 0) <= lastCloudRev) return;
    applyRemote(data);
  }, err => { console.error('onSnapshot:', err); setCloudStatus('off'); });
}

function mergeRemote(remote, local) {
  const m = JSON.parse(JSON.stringify(local));
  m.products = Array.isArray(remote.products) ? remote.products : m.products;
  m.sellers  = Array.isArray(remote.sellers)  ? remote.sellers  : m.sellers;
  m.counter  = Math.max(m.counter || 1, remote.counter || 1);

  const byId = new Map((m.orders || []).map(o => [o.id, o]));
  (remote.orders || []).forEach(o => {
    const cur = byId.get(o.id);
    if (!cur) byId.set(o.id, o);
    else {
      const curScore = (cur.history || []).length + (cur.ts || 0) / 1e15;
      const remScore = (o.history || []).length + (o.ts || 0) / 1e15;
      if (remScore >= curScore) byId.set(o.id, o);
    }
  });
  m.orders = [...byId.values()].sort((a, b) => b.ts - a.ts);

  m.jornada = { ...(m.jornada || {}), ...(remote.jornada || {}) };

  const seen = new Map();
  [...(m.activity || []), ...(remote.activity || [])].forEach(a => { if (a) seen.set(a.t + '|' + a.ts, a); });
  m.activity = [...seen.values()].sort((a, b) => b.ts - a.ts).slice(0, 30);
  return m;
}

function applyRemote(data) {
  if (!data || applyingRemote) return;
  applyingRemote = true;
  try {
    lastCloudRev = Math.max(lastCloudRev, data.rev || 0);
    if (data.db) db = mergeRemote(data.db, db);
    if (Array.isArray(data.carsev) && !cloudDirty) saveFiltersSilent(data.carsev);
    migrateDB();
    saveDB();
    renderCurrent();
    setCloudStatus('ok');
  } catch (err) {
    console.error('applyRemote:', err);
  } finally {
    applyingRemote = false;
  }
}

function queueCloudSync(delay = 1200) {
  cloudDirty = true;
  if (!cloudReady) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(cloudPush, delay);
}

function cloudPush() {
  const r = cloudRef(); if (!r || !cloudDirty) return;
  cloudDirty = false;
  setCloudStatus('sync');
  const rev = Date.now();
  lastCloudRev = rev;
  r.set({ db, carsev: getFilters(), rev, writer: CLIENT_ID, ts: Date.now() })
    .then(() => setCloudStatus('ok'))
    .catch(err => { console.error('cloudPush:', err); cloudDirty = true; setCloudStatus('off'); });
}

function cloudSyncNow() {
  if (!cloudReady) { toast('Nube no disponible. Verifica la configuración de Firebase.', 'warn'); return; }
  cloudDirty = true; clearTimeout(cloudTimer); cloudPush();
  toast('Sincronizando con la nube…', 'info');
}

function cloudInfo() {
  if (!navigator.onLine) return { ic:'fa-plug-circle-xmark', cls:'bg-red-100 text-red-700',    label:'Sin conexión — trabajando en modo local', btn:false };
  if (cloudStatus === 'cfg') return { ic:'fa-triangle-exclamation', cls:'bg-amber-100 text-amber-700', label:'Firebase sin configurar — completa FIREBASE_CONFIG', btn:false };
  if (cloudStatus === 'sync') return { ic:'fa-cloud-arrow-up', cls:'bg-blue-100 text-blue-700', label:'Sincronizando con la nube…', btn:true };
  if (cloudStatus === 'ok')   return { ic:'fa-cloud',          cls:'bg-emerald-100 text-emerald-700', label:'Conectado a Firebase — datos en tiempo real', btn:true };
  return { ic:'fa-cloud-arrow-down', cls:'bg-steel-100 text-steel-600', label:'Solo local (nube no disponible)', btn:true };
}

/* ============================ 4. MODALES ============================ */
let pendingConfirm = null;
let modalPrevFocus = null;
const modalOpen = () => $('#modal-root').childElementCount > 0;

function openModal(html, wide=false) {
  const root = $('#modal-root');
  modalPrevFocus = document.activeElement;
  pendingConfirm = null;
  root.innerHTML = `
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-900/60 backdrop-blur-sm anim-fade" data-close="1">
      <div class="bg-white rounded-2xl shadow-2xl w-full ${wide ? 'max-w-4xl' : 'max-w-lg'} overflow-hidden border border-steel-200 flex flex-col max-h-[90vh]" data-modal-panel="1" tabindex="-1">
        ${html}
      </div>
    </div>`;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => {
    const f = root.querySelector('[data-modal-panel="1"]');
    if (f) { try { f.focus({ preventScroll:true }); } catch(e){} }
  });
}

function closeModal() {
  const root = $('#modal-root');
  if (root && root.childElementCount) root.innerHTML = '';
  pendingConfirm = null;
  if (document.body.style.overflow === 'hidden') document.body.style.overflow = '';
  if (modalPrevFocus && document.contains(modalPrevFocus)) {
    try { modalPrevFocus.focus({ preventScroll:true }); } catch(e){}
  }
  modalPrevFocus = null;
}

document.addEventListener('click', e => {
  if (!modalOpen() || !(e.target instanceof Element)) return;
  if (e.target.closest('[data-close]')) { e.preventDefault(); closeModal(); return; }
  if (!e.target.closest('[data-modal-panel]')) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalOpen()) { e.preventDefault(); closeModal(); }
});

function confirmDialog(title, msg, okLabel, onOk, danger=true) {
  pendingConfirm = typeof onOk === 'function' ? onOk : null;
  openModal(`
    <div class="p-6 space-y-4">
      <h3 class="text-base font-bold text-navy-900">${esc(title)}</h3>
      <p class="text-sm text-steel-600">${msg}</p>
      <div class="flex justify-end gap-3 pt-2">
        <button onclick="closeModal()" class="btn-line px-4 py-2 text-xs rounded-xl">Cancelar</button>
        <button onclick="runConfirm()" class="px-4 py-2 text-xs rounded-xl font-bold text-white ${danger ? 'bg-red-600 hover:bg-red-700' : 'bg-navy-900 hover:bg-navy-800'}">${esc(okLabel)}</button>
      </div>
    </div>`);
}

function runConfirm() {
  const fn = pendingConfirm;
  closeModal();
  if (fn) { try { fn(); } catch(err) { console.error(err); toast('Ocurrió un error al ejecutar la acción.', 'bad'); } }
}

/* ============================ 5. DIBUJOS TÉCNICOS SVG ============================ */
function logoSVG(size=40) {

    <path d="M32 3 L57 17 V47 L32 61 L7 47 V17 Z" fill="#0B1E36" stroke="#FFB000" stroke-width="2.5"/>
    <text x="32" y="36" text-anchor="middle" font-family="Oswald,sans-serif" font-weight="700" font-size="19" fill="#FFB000">TF</text>
    <text x="32" y="52" text-anchor="middle" font-family="Barlow,sans-serif" font-weight="600" font-size="6" fill="#fff" letter-spacing="2">FILTERS</text>
  </svg>`;
}

const dimH = (x1, x2, y, label) => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#9A6B00" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="${(x1+x2)/2}" y="${y-4}" text-anchor="middle" font-size="9" fill="#9A6B00" font-family="Barlow,sans-serif" font-weight="600">${label}</text>`;
const dimV = (y1, y2, x, label) => `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#9A6B00" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="${x+6}" y="${(y1+y2)/2+3}" font-size="9" fill="#9A6B00" font-family="Barlow,sans-serif" font-weight="600">${label}</text>`;
const L  = 'stroke="#2C4562" stroke-width="1.6" fill="none" stroke-linejoin="round"';
const LF = f => `stroke="#2C4562" stroke-width="1.6" fill="${f}" stroke-linejoin="round"`;

function techSVG(p) {
  const S = p.specs || {}; const h = S['Altura'] || ''; let body = '';
  if (p.style === 'spin') {
    body = `<rect x="80" y="30" width="60" height="76" rx="6" ${LF('#EDF1F5')}/>
      <line x1="80" y1="42" x2="140" y2="42" ${L}/><line x1="80" y1="50" x2="140" y2="50" ${L}/>
      <rect x="92" y="106" width="36" height="12" ${LF('#E2E8EE')}/>
      <line x1="70" y1="118" x2="150" y2="118" ${L}/>
      ${S['Diám. exterior'] ? dimH(80, 140, 22, S['Diám. exterior']) : ''}${h ? dimV(30, 118, 158, h) : ''}`;
  } else if (p.style === 'air') {
    const dAir = S['Diám. ext./int.'] ? S['Diám. ext./int.'].split('/')[0].trim() + ' Ø' : '';
    body = `<rect x="94" y="14" width="32" height="18" rx="2" ${LF('#E2E8EE')}/>

function loadCart() { try { cart = JSON.parse(localStorage.getItem(CART_PRE + session.id) || '[]'); } catch(e){ cart = []; } }
function saveCart() { localStorage.setItem(CART_PRE + session.id, JSON.stringify(cart)); if (session) setNav(); }
const cartCount = () => cart.reduce((a, l) => a + l.qty, 0);

function addToCart(code, qty=1, silent=false) {
  const p = prod(code);
  if (!p) return;
  if (p.stock <= 0) { toast('<b>' + esc(p.name) + '</b> está agotado.', 'warn'); return; }
  const d = volDisc(qty), pu = round2(p.price * (1 - d / 100));
  const line = cart.find(l => l.code === code && Math.abs(l.price - pu) < 0.001);
  const current = line ? line.qty : 0;
  if (current + qty > p.stock) { toast(`Stock disponible de <b>${esc(p.code)}</b>: <b>${p.stock}</b> u.`, 'warn'); return; }
  if (line) line.qty += qty; else cart.push({ code, qty, price: pu, base: p.price, name: p.name });
  saveCart();
  if (!silent) toast(`<b>${esc(p.name)}</b> agregado al pedido (${qty} u${qty > 1 ? 'ds' : ''}).`, 'ok');
}

function changeQty(i, delta) {
  cart[i].qty = Math.max(1, cart[i].qty + delta);
  cart[i].price = round2(cart[i].base * (1 - volDisc(cart[i].qty) / 100));
  saveCart(); renderView();
}

function removeLine(i){ cart.splice(i, 1); saveCart(); renderView(); }

function cartTotals() {
  const subtotal = round2(cart.reduce((a, item) => a + item.qty * item.price, 0));
  const atList   = round2(cart.reduce((a, item) => a + item.qty * item.base, 0));
  const tax      = round2(subtotal * IVA_RATE);
  return { subtotal, tax, total: round2(subtotal + tax), saving: round2(atList - subtotal) };
}

/* ¿Sesión de Administración? — gate para todo lo exclusivo de oficina */
function isAdmin() { return !!(session && session.role === 'admin'); }

/* Valida la sesión vigente contra la lista actual de vendedores (nube incluida).
   Si Administración da de baja o ELIMINA al vendedor en vivo, la sesión se revoca. */
function validateSession() {
  if (!session) return false;
  if (session.role === 'seller') {
    const u = sellerById(session.id);
    if (!u || u.active === false) {
      sessionStorage.removeItem(SESS_KEY);
      session = null; cart = [];
      toast('Tu cuenta de vendedor fue eliminada o desactivada por Administración.', 'warn');
      return false;
    }
    session.name = u.name;
    sessionStorage.setItem(SESS_KEY, JSON.stringify(session));
    return true;
  }
  if (session.role === 'admin') return true;
  sessionStorage.removeItem(SESS_KEY); session = null;
  return false;
}

function doLogin() {
  const role = $('#login-role').value;
  const cred = ($('#login-pass').value || '').trim();

  if (role === 'admin') {
    /* Administrador: contraseña OBLIGATORIA (corrige el acceso sin clave) */
    if (!cred) { toast('Ingresa la contraseña administrativa.', 'warn'); return; }
    if (cred !== ADMIN_USER.pass) { toast('Contraseña administrativa incorrecta.', 'bad'); return; }
    session = { id:'ADMIN', name: ADMIN_USER.name, role:'admin' };
  } else {
    /* Vendedor: nombre de la lista de activos + PIN personal asignado */
    const nameSel = ($('#login-name').value || '').trim();
    const list = activeSellers();
    if (!list.length) { toast('No hay vendedores activos. Solicita a Administración registrar uno.', 'bad'); return; }
    if (!nameSel) { toast('Selecciona tu nombre de vendedor.', 'warn'); return; }
    const u = list.find(x => x.name.toLowerCase() === nameSel.toLowerCase());
    if (!u) { toast('Vendedor no encontrado entre los activos.', 'bad'); return; }
    if (!/^\d{4}$/.test(cred) || cred !== String(u.pin)) { toast('Clave (PIN) incorrecta para <b>' + esc(u.name) + '</b>.', 'bad'); return; }
    session = { id: u.id, name: u.name, role:'seller' };
  }

  sessionStorage.setItem(SESS_KEY, JSON.stringify(session));
  ui.view = defaultView(); /* admin→dash · vendedor→catalog (siempre su interfaz) */
  loadCart();
  initApp();
}

function toolPlan() {
  const eng  = ENGINES.find(e => e.id === ui.planEngine) || ENGINES[0];
  const cond = CONDS[ui.planCond];
  const slots = [
    { label:'Aceite',       iv: eng.iv.oil,  code: eng.oil  },
    { label:'Combustible',  iv: eng.iv.fuel, code: eng.fuel },
    { label:'Aire primario',iv: eng.iv.airP, code: eng.airP }
  ].filter(s => s.code && s.iv);
  return `
  <div class="card space-y-4">
    <div class="grid sm:grid-cols-3 gap-3">
      <div>
        <label class="lbl">Motor</label>
        <select class="input" onchange="ui.planEngine=this.value;renderView()">
          ${ENGINES.map(e => `<option value="${e.id}" ${e.id === ui.planEngine ? 'selected' : ''}>${esc(e.label)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="lbl">Condición de vía</label>
        <select class="input" onchange="ui.planCond=this.value;renderView()">
          ${Object.entries(CONDS).map(([k, c]) => `<option value="${k}" ${k === ui.planCond ? 'selected' : ''}>${c.l}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="lbl">Kilometraje actual</label>
        <input type="number" min="0" step="500" class="input" value="${ui.planKm}" onchange="ui.planKm=Math.max(0,parseInt(this.value)||0);renderView()">
      </div>
    </div>
    <div class="space-y-3">
      ${slots.map(s => {
        const p = prod(s.code); if (!p) return '';
        const eff = Math.max(1, Math.round(s.iv * cond.f));
        const pct = Math.min(100, Math.round(ui.planKm / eff * 100));
        const due = ui.planKm >= eff;
        const rem = eff - ui.planKm;
        return `
        <div class="border border-steel-200 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center gap-4">
          <div class="blueprint border border-steel-200 rounded-lg p-2 shrink-0 self-start sm:self-center">${techSVG(p)}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="tag bg-navy-50 text-navy-700">${s.label}</span>
              <span class="text-[10px] font-mono text-steel-400">${p.code}</span>
            </div>
            <div class="font-semibold text-sm text-navy-900 mt-1">${esc(p.name)}</div>
            <div class="text-[11px] text-steel-500 mt-1">Base ${s.iv.toLocaleString('es-VE')} km → ajustado <b>${eff.toLocaleString('es-VE')} km</b> por condición de vía</div>
            <div class="h-2 bg-steel-100 rounded-full mt-2 overflow-hidden"><div class="h-full ${due ? 'bg-red-500' : pct > 75 ? 'bg-acc' : 'bg-emerald-500'}" style="width:${pct}%"></div></div>
            <div class="text-xs font-semibold mt-1 ${due ? 'text-red-600' : pct > 75 ? 'text-acc-dark' : 'text-emerald-600'}">
              ${due ? '<i class="fa-solid fa-triangle-exclamation"></i> Cambio requerido ahora' : '<i class="fa-solid fa-circle-check"></i> OK — próximo cambio en ' + rem.toLocaleString('es-VE') + ' km'}
            </div>
          </div>
          <button onclick="addToCart('${p.code}',${p.minVol || 1})" class="btn-amber px-3 py-2 text-xs rounded-xl shrink-0"><i class="fa-solid fa-cart-plus"></i> +${p.minVol || 1} u</button>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function submitOrder() {
  if (!cart.length) { toast('El pedido está vacío.', 'warn'); return; }
  const name = ($('#c-name').value || '').trim();
  if (!name) { toast('Indica el nombre del cliente.', 'warn'); return; }
  const rif = ($('#c-rif').value || '').trim().toUpperCase();
  if (rif && !RIF_OK(rif)) { toast('RIF inválido. Formato esperado: J-12345678-9', 'bad'); return; }
  const t = cartTotals();
  const number = 'TF26-' + String(db.counter).padStart(4, '0');
  db.counter++;
  db.orders.unshift({
    id: uid(), number, sellerId: session.id, sellerName: session.name, ts: Date.now(),
    client: {
      name, rif,
      contact: ($('#c-contact').value || '').trim(),
      phone: ($('#c-phone').value || '').trim(),
      address: ($('#c-address').value || '').trim()
    },
    items: cart.map(l => ({ ...l })),
    subtotal: t.subtotal, tax: t.tax, total: t.total, status: 'pendiente',
    history: [{ status: 'pendiente', ts: Date.now(), by: session.name }],
    rejectReason: ''
  });
  logActivity('fa-file-invoice', `Pedido ${number} generado por ${session.name}`);
  cart = []; saveCart(); saveDB();
  toast(`Pedido <b>${number}</b> enviado a oficina.`, 'ok');
  go('history');
}

function setOrderStatus(id, st) {
  if (!isAdmin()) { toast('Acción exclusiva de Administración.', 'bad'); return; }
  const o = db.orders.find(x => x.id === id); if (!o) return;
  const doIt = () => {
    if (st === 'despachado') {
      o.items.forEach(i => {
        const p = prod(i.code);
        if (p) p.stock = Math.max(0, p.stock - i.qty);
      });
    }
    o.status = st;
    o.history.push({ status: st, ts: Date.now(), by: session.name });
    logActivity(st === 'aprobado' ? 'fa-circle-check' : st === 'despachado' ? 'fa-truck-fast' : 'fa-circle-xmark',
      `Pedido ${o.number} ${ST[st].l.toLowerCase()} por ${session.name}`);
    saveDB(); renderView(); setNav();
    toast(`Pedido <b>${esc(o.number)}</b> marcado como ${ST[st].l}.`, st === 'rechazado' ? 'warn' : 'ok');
  };
  if (st === 'rechazado')       confirmDialog('Rechazar pedido',  `¿Rechazar <b>${esc(o.number)}</b> de ${esc((o.client || {}).name || 'cliente')}?`, 'Rechazar', doIt, true);
  else if (st === 'despachado') confirmDialog('Despachar pedido', `¿Confirmar despacho de <b>${esc(o.number)}</b>? Se descontará el stock del inventario.`, 'Despachar', doIt, false);
  else doIt();
}

function toggleJornada(id) {
  if (!isAdmin()) { toast('Acción exclusiva de Administración.', 'bad'); return; }
  const u = sellerById(id); if (!u) return;
  const j = db.jornada[id];
  if (j && !j.end) {
    j.end = Date.now();
    logActivity('fa-flag-checkered', `${u.name} finalizó jornada`);
    toast(`Jornada de <b>${esc(u.name)}</b> finalizada.`, 'info');
  } else {
    db.jornada[id] = { start: Date.now(), end: null };
    logActivity('fa-play', `${u.name} inició jornada`);
    toast(`Jornada de <b>${esc(u.name)}</b> iniciada.`, 'ok');
  }
  saveDB(); renderCrew();
}

function adjustStock(code, delta) {
  if (!isAdmin()) { toast('Acción exclusiva de Administración.', 'bad'); return; }
  const p = prod(code); if (!p) return;
  p.stock = Math.max(0, p.stock + delta);
  saveDB(); renderInventoryList();
}

function exportDB() {
  if (!isAdmin()) return;
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `truckfilters-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
  toast('Respaldo exportado correctamente.', 'ok');
}

function importDB(input) {
  if (!isAdmin()) return;
  const f = input.files && input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.products) || !Array.isArray(d.orders)) throw new Error('formato inválido');
      db = d;
      migrateDB();
      saveDB();
      queueCloudSync(0);
      renderView(); setNav();
      toast('Respaldo importado y sincronizado.', 'ok');
    } catch(e) {
      console.error(e);
      toast('Archivo inválido. Usa un respaldo generado por esta aplicación.', 'bad');
    }
  };
  r.readAsText(f);
  input.value = '';
}

function resetDB() {
  if (!isAdmin()) return;
  confirmDialog('Reiniciar datos', 'Se restaurará la base de datos de fábrica en este equipo Y en la nube. Los cambios actuales se perderán.', 'Reiniciar', () => {
    db = seedDB(); saveDB(); queueCloudSync(0); renderView(); setNav();
    toast('Datos restaurados y sincronizados.', 'ok');
  }, true);
}

function saveSellerForm(e) {
  e.preventDefault();
  if (!isAdmin()) { toast('Acción exclusiva de Administración.', 'bad'); return; }
  const name  = ($('#s-name').value  || '').trim();
  const id    = ($('#s-id').value    || '').trim();
  const zone  = ($('#s-zone').value  || '').trim();
  const pin   = ($('#s-pin').value   || '').trim();
  const editId = $('#s-editId').value;

  if (!name || !id || !zone || !pin) { toast('Completa todos los campos.', 'warn'); return; }
  if (!/^\d{4}$/.test(pin)) { toast('El PIN debe tener exactamente 4 dígitos.', 'warn'); return; }
  if (getSellers().some(s => s.id.toLowerCase() === id.toLowerCase() && s.id !== editId)) {
    toast('Esa cédula/ID ya está asignada a otro vendedor.', 'warn'); return;
  }
  if (getSellers().some(s => s.name.toLowerCase() === name.toLowerCase() && s.id !== editId)) {
    toast('Ya existe un vendedor con ese nombre (se usa para el login).', 'warn'); return;
  }

  if (editId) {
    const s = sellerById(editId);
    if (!s) { toast('El vendedor a editar ya no existe.', 'bad'); return; }
    if (editId !== id && db.jornada[editId]) { db.jornada[id] = db.jornada[editId]; delete db.jornada[editId]; }
    s.name = name; s.id = id; s.zone = zone; s.pin = pin;
    logActivity('fa-user-pen', `Vendedor actualizado: ${name} (${id})`);
    saveDB(); queueCloudSync(0); resetSellerForm(); renderCrew();
    toast(`Ficha de <b>${esc(name)}</b> actualizada y sincronizada.`, 'ok');
  } else {
    getSellers().push({ id, name, zone, pin, active: true });
    logActivity('fa-user-plus', `Vendedor registrado: ${name} (${id}) — zona ${zone}`);
    saveDB(); queueCloudSync(0); resetSellerForm(); renderCrew();
    toast(`<b>${esc(name)}</b> registrado. Ya puede iniciar sesión con su PIN desde cualquier teléfono.`, 'ok');
  }
}

function toggleSellerActive(i) {
  if (!isAdmin()) { toast('Acción exclusiva de Administración.', 'bad'); return; }

/* ==================== PURGA COMPLETA DE UN VENDEDOR ====================
   Borra de db (y propaga a Firestore con queueCloudSync(0)):
   1) El registro del vendedor en db.sellers.
   2) Su jornada/asistencia en db.jornada (inicio, fin, registro de hoy).
   3) TODOS sus pedidos creados HOY (ts >= inicio del día).
   Los pedidos de días anteriores se conservan como historial. */
function purgeSellerById(id) {
  const s = sellerById(id);
  const name = s ? s.name : id;
  const idx = getSellers().findIndex(x => x.id === id);
  if (idx >= 0) getSellers().splice(idx, 1);
  delete db.jornada[id]; /* jornada + asistencia del día */

  const before = db.orders.length;
  db.orders = db.orders.filter(o => !(o.sellerId === id && o.ts >= t0()));
  const removed = before - db.orders.length;

  logActivity('fa-user-minus', `Vendedor eliminado: ${name} — jornada y ${removed} pedido(s) de hoy borrados`);
  saveDB();
  queueCloudSync(0);   /* Firestore al instante → onSnapshot actualiza los demás teléfonos */
  resetSellerForm();
  renderCrew();        /* la tarjeta desaparece de la pantalla YA */
  return removed;
}

/* Cestica de la TARJETA de jornada (arriba a la derecha) */
function deleteCrewCard(id) {
  if (!isAdmin()) { toast('Acción exclusiva de Administración.', 'bad'); return; }
  const s = sellerById(id);
  const name = s ? s.name : id;
  const nToday = db.orders.filter(o => o.sellerId === id && o.ts >= t0()).length;
  const msg = `Se eliminará a <b>${esc(name)}</b> y se limpiarán de la nube su jornada y asistencia${nToday ? `, junto con <b>${nToday}</b> pedido(s) creados hoy` : ''}. Los pedidos de días anteriores se conservan en el historial. Esta acción no se puede deshacer.`;
  confirmDialog('Eliminar vendedor y su jornada de hoy', msg, 'Eliminar todo', () => {
    const removed = purgeSellerById(id);
    toast(`<b>${esc(name)}</b> eliminado${removed ? ` · ${removed} pedido(s) de hoy borrados` : ''}. Tarjeta de jornada actualizada.`, 'warn');
  }, true);

  if (!file) return;
  if (!/^image\//.test(file.type)) { toast('Selecciona un archivo de imagen (JPG o PNG).', 'warn'); input.value = ''; return; }
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX = 800;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width  = Math.round(img.width  * scale);
      cv.height = Math.round(img.height * scale);
      try { cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); pendingFilterPhoto = cv.toDataURL('image/jpeg', 0.85); }
      catch(err) { pendingFilterPhoto = r.result; }
      const pv = document.getElementById('imgPreview'); if (pv) pv.src = pendingFilterPhoto;
      toast('Foto lista. Se guardará con la ficha.', 'ok', 2200);
    };
    img.onerror = () => { toast('No se pudo procesar la imagen.', 'bad'); };
    img.src = r.result;
  };
  r.readAsDataURL(file);
  input.value = '';
}

function handleSaveFilter(e) {
  e.preventDefault();
  if (!isAdmin()) { toast('Gestión de filtros exclusiva de Administración.', 'bad'); return; }
  const f = {
    codigo:      ($('#inputCodigo').value      || '').trim().toUpperCase(),
    aplicacion:  ($('#inputAplicacion').value  || '').trim(),
    dimensiones: ($('#inputDimensiones').value || '').trim(),
    imagen:      ($('#inputImagen').value      || '').trim()
  };
  if (!f.codigo || !f.aplicacion || !f.dimensiones) { toast('Completa código, aplicación y dimensiones.', 'warn'); return; }
  const list = getFilters();
  const idxRaw = $('#editIndex').value;
  const editing = idxRaw !== '' && list[+idxRaw];
  f.img = pendingFilterPhoto || (editing ? list[+idxRaw].img || null : null);
  if (editing) list[+idxRaw] = f; else list.push(f);
  saveFilters(list);
  resetAdminForm();
  renderFilterCatalogGrid();
  toast(editing ? `Ficha <b>${esc(f.codigo)}</b> actualizada y sincronizada.` : `Filtro <b>${esc(f.codigo)}</b> agregado y visible para todos los vendedores.`, 'ok');
}

function resetAdminForm() {
  const form = document.getElementById('filterAdminForm'); if (form) form.reset();
  $('#editIndex').value = '';
  pendingFilterPhoto = null;
  const pv = document.getElementById('imgPreview'); if (pv) pv.src = FILTER_IMG_FALLBACK;
  const btn = $('#filterSaveBtn'); if (btn) btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Guardar filtro';
}

function editFilter(i) {
  if (!isAdmin()) { toast('Gestión de filtros exclusiva de Administración.', 'bad'); return; }
  const f = getFilters()[i]; if (!f) return;
  const d = document.getElementById('filterFormDetails'); if (d) d.open = true;
  $('#editIndex').value = String(i);
  $('#inputCodigo').value      = f.codigo      || '';
  $('#inputAplicacion').value  = f.aplicacion  || '';
  $('#inputDimensiones').value = f.dimensiones || '';
  $('#inputImagen').value      = f.imagen      || '';
  pendingFilterPhoto = f.img || null;
  const pv = document.getElementById('imgPreview'); if (pv) pv.src = filterImgSrc(f);
  const btn = $('#filterSaveBtn'); if (btn) btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Actualizar filtro';
  const form = document.getElementById('filterAdminForm');
  if (form) setTimeout(() => form.scrollIntoView({ behavior:'smooth', block:'center' }), 60);
  toast(`Editando <b>${esc(f.codigo)}</b>.`, 'info');
}

function deleteFilter(i) {
  if (!isAdmin()) { toast('Gestión de filtros exclusiva de Administración.', 'bad'); return; }
  const list = getFilters(); const f = list[i]; if (!f) return;
  confirmDialog('Eliminar filtro', `¿Eliminar <b>${esc(f.codigo)}</b> (${esc(f.aplicacion)}) del catálogo visual? Se quitará también de los teléfonos.`, 'Eliminar', () => {
    list.splice(i, 1); saveFilters(list); renderFilterCatalogGrid();
    toast('Filtro eliminado del catálogo.', 'warn');
  }, true);
}

/* ============================ 19. MOTOR DE RENDERIZADO (filtrado por rol) ============================ */
function renderView() {
  const v = $('#view');
  if (!v) return;
  /* Filtrado estricto: si la vista no pertenece al NAV del rol actual,
     se sustituye por la vista inicial. Un vendedor JAMÁS renderiza 'dash',
     'orders', 'crew' (donde vive la Gestión de vendedores), 'inventory' ni 'backup'. */
  if (session && !navIdsFor().includes(ui.view)) ui.view = defaultView();
  let html = '';
  try {
    switch (ui.view) {
      case 'catalog':   html = viewCatalog();   break;
      case 'tools':     html = viewTools();     break;
      case 'cart':      html = viewCart();      break;
      case 'history':   html = viewHistory();   break;
      case 'dash':      html = viewDash();      break;
      case 'orders':    html = viewOrders();    break;
      case 'crew':      html = viewCrew();      break;
      case 'inventory': html = viewInventory(); break;
      case 'backup':    html = viewBackup();    break;
      default:
        html = `
        <div class="p-4 pb-24 max-w-3xl mx-auto">
          <div class="card text-center space-y-3">
            <i class="fa-solid fa-map-signs text-3xl text-steel-300"></i>
            <p class="text-sm text-steel-500">La vista "<b>${esc(ui.view)}</b>" no está disponible.</p>
            <button onclick="go(defaultView())" class="btn-navy px-4 py-2 text-xs rounded-xl mx-auto">Volver al inicio</button>
          </div>
        </div>`;
    }
  } catch (err) {
    console.error('renderView("' + ui.view + '"):', err);
    html = `
    <div class="p-4 pb-24 max-w-3xl mx-auto">
      <div class="bg-white border border-red-200 rounded-2xl shadow-sm p-5 text-center space-y-3">
        <i class="fa-solid fa-bug text-3xl text-red-300"></i>
        <p class="text-sm text-steel-600">No se pudo dibujar esta vista. Revisa la consola para más detalles.</p>
        <button onclick="renderView()" class="btn-line px-4 py-2 text-xs rounded-xl mx-auto"><i class="fa-solid fa-rotate-right"></i> Reintentar</button>
      </div>
    </div>`;
  }
  v.innerHTML = html;
  if (ui.view === 'catalog') renderFilterCatalogGrid();
}

/* ============================ 20. ARRANQUE ============================ */
function initApp() {
  cloudInit(); /* Firestore + tiempo real + caché offline (PWA intacta) */
  if (!session || !validateSession()) { renderLogin(); return; }
  loadCart();
  if (!navIdsFor().includes(ui.view)) ui.view = defaultView();
  renderShell();
  renderView();
}

document.addEventListener('DOMContentLoaded', initApp);
window.addEventListener('online',  () => { updateConnChip(); if (cloudReady) { cloudPull(); if (cloudDirty) queueCloudSync(500); } });
window.addEventListener('offline', updateConnChip);
</script>
